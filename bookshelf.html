<script>
  // このアプリ専用のローカル保存。ブラウザの localStorage に保存されるので、
  // 同じ端末・同じブラウザで開けばデータは残ります。
  window.storage = {
    async get(key) {
      const v = localStorage.getItem(key);
      return v === null ? null : { key, value: v };
    },
    async set(key, value) {
      localStorage.setItem(key, value);
      return { key, value };
    },
    async delete(key) {
      localStorage.removeItem(key);
      return { key, deleted: true };
    },
    async list(prefix) {
      const p = prefix || "";
      const keys = Object.keys(localStorage).filter((k) => k.startsWith(p));
      return { keys };
    },
  };
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

const KEY = "bookshelf:v3";
const OLD = "bookshelf:v2";

const SCOPES = [
  { id: "overseas", label: "海外の作品", sub: "原書と翻訳をまとめて" },
  { id: "domestic", label: "日本語小説", sub: "国内の作家" },
  { id: "ebook", label: "電子", sub: "電子書籍" },
];

const EDS = [
  { k: "orig", label: "原書" },
  { k: "tr", label: "翻訳" },
];

const ed = (total, owned, on = true, vnames = {}) => ({ on, total, owned, vnames });
const vname = (e, v) => (e && e.vnames && e.vnames[v]) || "";

const SAMPLES = [
  { id: "s1", scope: "overseas", kind: "series", title: "Harry Potter", alt: "ハリー・ポッター", author: "J.K. Rowling／松岡佑子 訳", orig: ed(7, [1, 2, 3, 5, 7]), tr: ed(8, [1, 2, 3, 4], true, { 1: "賢者の石", 2: "秘密の部屋", 3: "アズカバンの囚人", 4: "炎のゴブレット", 5: "不死鳥の騎士団", 6: "謎のプリンス", 7: "死の秘宝 上", 8: "死の秘宝 下" }), audible: ed(7, [1, 2], true), note: "訳書は死の秘宝が上下巻で全8冊", sample: true, addedAt: 6 },
  { id: "s2", scope: "overseas", kind: "single", title: "The Catcher in the Rye", alt: "ライ麦畑でつかまえて", author: "J.D. Salinger", orig: ed(1, [1]), tr: ed(1, []), audible: ed(1, [], false), note: "原書はあるので訳書を買うか迷い中", sample: true, addedAt: 5 },
  { id: "s3", scope: "overseas", kind: "series", title: "Millennium", alt: "ミレニアム", author: "Stieg Larsson", orig: ed(3, [], false), tr: ed(3, [1, 3]), audible: ed(3, [], false), note: "訳書だけ集める", sample: true, addedAt: 4 },
  { id: "s4", scope: "overseas", kind: "single", title: "Beyond the Wand", alt: "", author: "Tom Felton", orig: ed(1, [1]), tr: ed(1, [], false), audible: ed(1, [], false), note: "翻訳は自分で読む用に訳している", sample: true, addedAt: 3 },
  { id: "s8", scope: "ebook", kind: "series", title: "十二国記", alt: "", author: "小野不由美", orig: ed(1, [], false), tr: ed(11, [1, 2, 3, 5], true, { 1: "月の影 影の海", 2: "風の海 迷宮の岸", 3: "東の海神 西の滄海" }), audible: ed(1, [], false), note: "Kindleでまとめ買い予定", sample: true, addedAt: 7 },
  { id: "s9", scope: "ebook", kind: "series", title: "Once Upon a Broken Heart", alt: "", author: "Stephanie Garber", orig: ed(3, [2, 3], true, { 1: "Once Upon a Broken Heart", 2: "The Ballad of Never After", 3: "A Curse for True Love" }), tr: ed(1, [], false), audible: ed(1, [], false), note: "Kindleで2・3巻所持", sample: true, addedAt: 8 },
  { id: "s5", scope: "domestic", kind: "series", title: "銀河英雄伝説", alt: "", author: "田中芳樹", orig: ed(10, [1, 2, 3, 4, 6, 7]), tr: ed(1, [], false), audible: ed(10, [], false), note: "文庫版", sample: true, addedAt: 2 },
  { id: "s6", scope: "domestic", kind: "single", title: "コンビニ人間", alt: "", author: "村田沙耶香", orig: ed(1, [1]), tr: ed(1, [], false), audible: ed(1, [], false), note: "", sample: true, addedAt: 1 },
];

const CSS = `

.bs-ta{width:100%;min-height:120px;font-size:12px;font-family:ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:8px;padding:8px;color:var(--ink);}
`;

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const nums = (n) => Array.from({ length: n }, (_, i) => i + 1);
const AUDIBLE = { k: "audible", label: "Audible" };
const missOf = (e) => (e && e.on ? nums(e.total).filter((v) => !e.owned.includes(v)) : []);
const edsFor = (b) => {
  const base = b.scope === "domestic" ? [EDS[0]] : EDS;
  return b.audible && b.audible.on ? [...base, AUDIBLE] : base;
};
const workMiss = (b) => edsFor(b).map((x) => ({ ...x, miss: missOf(b[x.k]) })).filter((x) => x.miss.length);
const missLabel = (e, miss) => miss.map((v) => (vname(e, v) ? `${v}巻　${vname(e, v)}` : `${v}巻`)).join("／");
const missTitles = (e, miss) => miss.map((v) => vname(e, v) || `${v}巻`).join("／");

const migrate = (old) =>
  old.map((b) => {
    const e = ed(b.total, b.owned, true, b.vnames || {});
    const off = ed(1, [], false);
    const audible = ed(b.total, [], false);
    if (b.cat === "japanese") return { id: b.id, scope: "domestic", kind: b.kind, title: b.title, alt: "", author: b.author, orig: e, tr: off, audible, note: b.note, addedAt: b.addedAt };
    if (b.cat === "translated") return { id: b.id, scope: "overseas", kind: b.kind, title: b.title, alt: "", author: b.author, orig: { ...off, total: b.total }, tr: e, audible, note: b.note, addedAt: b.addedAt };
    return { id: b.id, scope: "overseas", kind: b.kind, title: b.title, alt: "", author: b.author, orig: e, tr: { ...off, total: b.total }, audible, note: b.note, addedAt: b.addedAt };
  });

function Bookshelf() {
  const [books, setBooks] = useState([]);
  const [ready, setReady] = useState(false);
  const [note, setNote] = useState("");
  const [scope, setScope] = useState("overseas");
  const [kind, setKind] = useState("series");
  const [q, setQ] = useState("");
  const [sort, setSort] = useState("added");
  const [onlyGaps, setOnlyGaps] = useState(false);
  const [showForm, setShowForm] = useState(false);
  const [editId, setEditId] = useState(null);
  const [vnameId, setVnameId] = useState(null);
  const [askDel, setAskDel] = useState(null);
  const [modal, setModal] = useState(null);
  const [importText, setImportText] = useState("");

  const blank = { title: "", alt: "", author: "", oTotal: 1, tTotal: 1, aTotal: 1, oOn: true, tOn: true, aOn: false, note: "" };
  const [form, setForm] = useState(blank);

  useEffect(() => {
    (async () => {
      let loaded = null;
      try {
        const r = await window.storage.get(KEY);
        if (r && r.value) loaded = JSON.parse(r.value);
      } catch (e) {}
      if (!loaded) {
        try {
          const r2 = await window.storage.get(OLD);
          if (r2 && r2.value) {
            const o = JSON.parse(r2.value).filter((b) => !b.sample);
            if (o.length) loaded = migrate(o);
          }
        } catch (e) {}
      }
      setBooks(loaded && loaded.length ? loaded : SAMPLES);
      setReady(true);
    })();
  }, []);

  const persist = async (next) => {
    setBooks(next);
    try {
      await window.storage.set(KEY, JSON.stringify(next));
      setNote("保存しました");
    } catch (e) {
      setNote("保存できません。データ管理からJSONを控えてください");
    }
    setTimeout(() => setNote(""), 2000);
  };

  const add = () => {
    if (!form.title.trim()) return;
    const single = kind === "single";
    const oT = single ? 1 : Math.max(1, Number(form.oTotal) || 1);
    const tT = single ? 1 : Math.max(1, Number(form.tTotal) || 1);
    persist([
      {
        id: uid(), scope, kind, title: form.title.trim(), alt: form.alt.trim(), author: form.author.trim(),
        orig: ed(oT, [], scope === "domestic" ? true : form.oOn),
        tr: ed(tT, [], scope === "domestic" ? false : form.tOn),
        audible: ed(single ? 1 : Math.max(1, Number(form.aTotal) || 1), [], form.aOn),
        note: form.note.trim(), addedAt: Date.now(),
      },
      ...books,
    ]);
    setForm(blank);
    setShowForm(false);
  };

  const patch = (id, ch) => persist(books.map((b) => (b.id === id ? { ...b, ...ch } : b)));
  const patchEd = (b, k, ch) => patch(b.id, { [k]: { ...b[k], ...ch } });
  const toggleVol = (b, k, v) => {
    const e = b[k];
    patchEd(b, k, { owned: e.owned.includes(v) ? e.owned.filter((x) => x !== v) : [...e.owned, v].sort((a, c) => a - c) });
  };
  const setTotal = (b, k, t) => {
    const n = Math.max(1, Math.min(300, t));
    patchEd(b, k, { total: n, owned: b[k].owned.filter((v) => v <= n) });
  };

  const view = useMemo(() => {
    const key = q.trim().toLowerCase();
    let list = books.filter((b) => b.scope === scope && b.kind === kind);
    if (key) list = list.filter((b) => (b.title + " " + b.alt + " " + b.author + " " + (b.note || "")).toLowerCase().includes(key));
    if (onlyGaps) list = list.filter((b) => workMiss(b).length);
    const cnt = (b) => workMiss(b).reduce((n, x) => n + x.miss.length, 0);
    const s = {
      added: (a, b) => b.addedAt - a.addedAt,
      gaps: (a, b) => cnt(b) - cnt(a),
      title: (a, b) => a.title.localeCompare(b.title, "ja"),
      author: (a, b) => (a.author || "ん").localeCompare(b.author || "ん", "ja"),
    };
    return [...list].sort(s[sort]);
  }, [books, scope, kind, q, sort, onlyGaps]);

  const gapBooks = useMemo(() => books.filter((b) => workMiss(b).length), [books]);
  const gapVolumes = gapBooks.reduce((n, b) => n + workMiss(b).reduce((m, x) => m + x.miss.length, 0), 0);
  const ownedVolumes = books.reduce((n, b) => n + edsFor(b).reduce((m, x) => m + (b[x.k].on ? b[x.k].owned.length : 0), 0), 0);
  const gapIn = (s) => gapBooks.filter((b) => b.scope === s).length;
  const hasSample = books.some((b) => b.sample);
  const gapText = gapBooks
    .map((b) => `${b.title}${b.alt ? "／" + b.alt : ""}：` + workMiss(b).map((x) => (b.scope === "domestic" ? "" : x.label + " ") + (b.kind === "single" ? "未所持" : missLabel(b[x.k], x.miss))).join(" ／ "))
    .join("\n");

  const searchHint = q.trim() && view.length === 0 && books.some((b) => (b.title + b.alt + b.author).toLowerCase().includes(q.trim().toLowerCase()));

  return (
    <div className="bs-root">
      <style>{CSS}</style>
      <div className="bs-wrap">
        <h1 className="bs-brand">Book shelf</h1>
        <p className="bs-lede">海外の作品は、原書と翻訳をひとつのカードに並べています。どちらを持っていてどちらが無いか、同時に見えます。</p>

        <div className="bs-stats">
          <div className="bs-stat alert"><b>{gapVolumes}</b><span>足りない巻</span></div>
          <div className="bs-stat"><b>{books.length}</b><span>作品</span></div>
          <div className="bs-stat"><b>{ownedVolumes}</b><span>持っている冊数</span></div>
          <button className="bs-btn ghost" onClick={() => setModal("gaps")}>足りない巻をまとめて見る</button>
        </div>

        {hasSample && (
          <div className="bs-sample">
            <span>いま入っているのは見本です。</span>
            <button className="bs-btn tiny" onClick={() => persist(books.filter((b) => !b.sample))}>見本を消す</button>
          </div>
        )}

        <div className="bs-tabs" role="tablist">
          {SCOPES.map((c) => (
            <div key={c.id} role="tab" tabIndex={0} aria-selected={scope === c.id} className={"bs-tab bs-tab-" + c.id}
              onClick={() => setScope(c.id)} onKeyDown={(e) => e.key === "Enter" && setScope(c.id)}>
              <b className="bs-mincho">{c.label}</b>
              <span>{c.sub}</span>
              <i>{gapIn(c.id) > 0 ? `● 抜け ${gapIn(c.id)}` : "\u00a0"}</i>
            </div>
          ))}
        </div>

        <div className="bs-bar">
          <div className="bs-seg">
            <button aria-pressed={kind === "series"} onClick={() => setKind("series")}>続きもの</button>
            <button aria-pressed={kind === "single"} onClick={() => setKind("single")}>単巻</button>
          </div>
          <label className="bs-check"><input type="checkbox" checked={onlyGaps} onChange={(e) => setOnlyGaps(e.target.checked)} /> 抜けだけ表示</label>
        </div>

        <div className="bs-bar">
          <input className="bs-input bs-grow" placeholder="原題・邦題・著者で探す" value={q} onChange={(e) => setQ(e.target.value)} />
          <select className="bs-select" value={sort} onChange={(e) => setSort(e.target.value)}>
            <option value="added">登録が新しい順</option>
            <option value="gaps">抜けが多い順</option>
            <option value="title">タイトル順</option>
            <option value="author">著者順</option>
          </select>
          <button className="bs-btn" onClick={() => { setShowForm(!showForm); setEditId(null); }}>{showForm ? "閉じる" : "作品を登録"}</button>
          <button className="bs-btn ghost" onClick={() => setModal("data")}>データ管理</button>
        </div>
        {note && <p className="bs-hint">{note}</p>}
        {searchHint && <p className="bs-hint">この棚では見つかりません。もう一方のタブや「単巻／続きもの」を切り替えてみてください。</p>}

        {showForm && (
          <div className="bs-panel">
            <p className="bs-eyebrow" style={{ marginBottom: 10 }}>{SCOPES.find((c) => c.id === scope).label} ／ {kind === "series" ? "続きもの" : "単巻"}</p>
            <label className="bs-field"><span>{scope !== "domestic" ? (kind === "series" ? "シリーズ名" : "原題") : "タイトル"}</span>
              <input className="bs-input" style={{ width: "100%" }} value={form.title} onChange={(e) => setForm({ ...form, title: e.target.value })} />
            </label>
            {scope !== "domestic" && (
              <label className="bs-field"><span>邦題</span>
                <input className="bs-input" style={{ width: "100%" }} value={form.alt} onChange={(e) => setForm({ ...form, alt: e.target.value })} placeholder="翻訳のタイトル" />
              </label>
            )}
            <label className="bs-field"><span>著者・訳者</span>
              <input className="bs-input" style={{ width: "100%" }} value={form.author} onChange={(e) => setForm({ ...form, author: e.target.value })} />
            </label>
            {scope !== "domestic" ? (
              <div className="bs-row" style={{ marginBottom: 10 }}>
                <label className="bs-check"><input type="checkbox" checked={form.oOn} onChange={(e) => setForm({ ...form, oOn: e.target.checked })} /> 原書を集める</label>
                {kind === "series" && form.oOn && (
                  <label className="bs-field" style={{ marginBottom: 0 }}><span>原書の全巻数</span>
                    <input className="bs-input" style={{ width: 80 }} type="number" inputMode="numeric" min="1" value={form.oTotal} onChange={(e) => setForm({ ...form, oTotal: e.target.value })} />
                  </label>
                )}
                <label className="bs-check"><input type="checkbox" checked={form.tOn} onChange={(e) => setForm({ ...form, tOn: e.target.checked })} /> 翻訳を集める</label>
                {kind === "series" && form.tOn && (
                  <label className="bs-field" style={{ marginBottom: 0 }}><span>翻訳の全巻数</span>
                    <input className="bs-input" style={{ width: 80 }} type="number" inputMode="numeric" min="1" value={form.tTotal} onChange={(e) => setForm({ ...form, tTotal: e.target.value })} />
                  </label>
                )}
              </div>
            ) : (
              kind === "series" && (
                <label className="bs-field"><span>全巻数</span>
                  <input className="bs-input" style={{ width: 80 }} type="number" inputMode="numeric" min="1" value={form.oTotal} onChange={(e) => setForm({ ...form, oTotal: e.target.value })} />
                </label>
              )
            )}
            <div className="bs-row" style={{ marginBottom: 10 }}>
              <label className="bs-check"><input type="checkbox" checked={form.aOn} onChange={(e) => setForm({ ...form, aOn: e.target.checked })} /> Audibleがある</label>
              {kind === "series" && form.aOn && (
                <label className="bs-field" style={{ marginBottom: 0 }}><span>Audibleの全巻数</span>
                  <input className="bs-input" style={{ width: 80 }} type="number" inputMode="numeric" min="1" value={form.aTotal} onChange={(e) => setForm({ ...form, aTotal: e.target.value })} />
                </label>
              )}
            </div>
            <label className="bs-field"><span>メモ</span>
              <input className="bs-input" style={{ width: "100%" }} value={form.note} onChange={(e) => setForm({ ...form, note: e.target.value })} placeholder="版元、判型、巻割の違いなど" />
            </label>
            <p className="bs-hint" style={{ marginBottom: 10 }}>登録すると全部「未所持」状態で並びます。持っている巻をタップして薄い色に変えてください。ほとんどの作品はAudibleなしのままで問題ありません。</p>
            <button className="bs-btn" onClick={add}>この棚に入れる</button>
          </div>
        )}

        {!ready ? (
          <p className="bs-hint">読み込み中です。</p>
        ) : view.length === 0 ? (
          <div className="bs-empty">{onlyGaps ? "この棚に抜けはありません。" : "この棚はまだ空です。「作品を登録」から追加してください。"}</div>
        ) : (
          view.map((b) => {
            const gaps = workMiss(b);
            const editing = editId === b.id;
            const eds = edsFor(b);
            return (
              <div className={"bs-card" + (gaps.length ? " has-gap" : "")} key={b.id}>
                {editing ? (
                  <>
                    <label className="bs-field"><span>{b.scope !== "domestic" ? (b.kind === "series" ? "シリーズ名" : "原題") : "タイトル"}</span>
                      <input className="bs-input" style={{ width: "100%" }} value={b.title} onChange={(e) => patch(b.id, { title: e.target.value })} />
                    </label>
                    {b.scope !== "domestic" && (
                      <label className="bs-field"><span>邦題</span>
                        <input className="bs-input" style={{ width: "100%" }} value={b.alt || ""} onChange={(e) => patch(b.id, { alt: e.target.value })} />
                      </label>
                    )}
                    <label className="bs-field"><span>著者・訳者</span>
                      <input className="bs-input" style={{ width: "100%" }} value={b.author} onChange={(e) => patch(b.id, { author: e.target.value })} />
                    </label>
                    <label className="bs-field"><span>メモ</span>
                      <input className="bs-input" style={{ width: "100%" }} value={b.note || ""} onChange={(e) => patch(b.id, { note: e.target.value })} />
                    </label>
                    {b.scope !== "domestic" && (
                      <div className="bs-row">
                        {EDS.map((x) => (
                          <label className="bs-check" key={x.k}>
                            <input type="checkbox" checked={b[x.k].on} onChange={(e) => patchEd(b, x.k, { on: e.target.checked })} /> {x.label}を集める
                          </label>
                        ))}
                      </div>
                    )}
                    <div className="bs-row" style={{ marginTop: 6 }}>
                      <label className="bs-check">
                        <input type="checkbox" checked={!!(b.audible && b.audible.on)} onChange={(e) => patchEd(b, "audible", { on: e.target.checked })} /> Audibleがある
                      </label>
                    </div>
                  </>
                ) : (
                  <>
                    <div className="bs-ct">{b.title}</div>
                    {b.alt && <div className="bs-alt">{b.alt}</div>}
                    {b.author && <div className="bs-ca">{b.author}</div>}
                  </>
                )}

                {gaps.length ? (
                  <div className="bs-sum">
                    {gaps.map((x) => (
                      <span key={x.k}>
                        <span className="bs-sum-tag">{b.scope === "domestic" ? "未所持" : x.label + " 未所持"}　</span>
                        <span className="bs-sum-num" style={{ fontFamily: '"Baloo 2","Fredoka",sans-serif' }}>{b.kind === "single" ? "この1冊" : missTitles(b[x.k], x.miss)}</span>
                      </span>
                    ))}
                  </div>
                ) : (
                  <div className="bs-full">そろっています</div>
                )}

                {eds.map((x) => {
                  const e = b[x.k];
                  const missNamed = b.kind === "series" ? nums(e.total).filter((v) => !e.owned.includes(v) && vname(e, v)) : [];
                  return (
                    <div key={x.k}>
                      <div className="bs-ed">
                        <div className="bs-ed-label">{b.scope === "domestic" ? "巻" : x.label}</div>
                        {!e.on ? (
                          <div className="bs-off">集めていません</div>
                        ) : b.kind === "single" ? (
                          <button className={"bs-chip " + (e.owned.includes(1) ? "have" : "miss")} onClick={() => toggleVol(b, x.k, 1)}>
                            {e.owned.includes(1) ? "持っている" : "未所持"}
                          </button>
                        ) : (
                          <div className="bs-spines">
                            {nums(e.total).map((v) => {
                              const have = e.owned.includes(v);
                              return (
                                <button key={v} className={"bs-spine " + (have ? "have" : "miss")} onClick={() => toggleVol(b, x.k, v)}
                                  aria-label={`${x.label}${v}巻 ${have ? "持っている" : "未所持"}`}>{v}</button>
                              );
                            })}
                          </div>
                        )}
                      </div>
                      {e.on && missNamed.length > 0 && (
                        <div className="bs-vnames">
                          <span className="bs-vnames-label">未所持</span>
                          <p className="bs-vnames-list">
                            {missNamed.map((v) => (
                              <span key={v}>{v}巻　{vname(e, v)}</span>
                            ))}
                          </p>
                        </div>
                      )}
                    </div>
                  );
                })}

                {b.kind === "series" && (
                  <button className="bs-btn ghost tiny" style={{ marginTop: 8 }} onClick={() => setVnameId(vnameId === b.id ? null : b.id)}>
                    {vnameId === b.id ? "巻タイトルを閉じる" : "巻タイトルを書く"}
                  </button>
                )}

                {vnameId === b.id && b.kind === "series" && (
                  <div className="bs-panel" style={{ marginTop: 8 }}>
                    <p className="bs-eyebrow" style={{ marginBottom: 8 }}>巻ごとにタイトルが違う場合、わかる範囲でどうぞ</p>
                    {eds.filter((x) => b[x.k].on).map((x) => (
                      <div key={x.k} style={{ marginBottom: 10 }}>
                        <p className="bs-hint" style={{ marginBottom: 6 }}>{b.scope === "domestic" ? "" : x.label}</p>
                        {nums(b[x.k].total).map((v) => (
                          <div key={v} className="bs-row" style={{ marginBottom: 6, alignItems: "center" }}>
                            <span style={{ fontSize: 12, color: "var(--soft)", width: 28 }}>{v}巻</span>
                            <input className="bs-input bs-grow" value={vname(b[x.k], v)}
                              onChange={(e2) => patchEd(b, x.k, { vnames: { ...(b[x.k].vnames || {}), [v]: e2.target.value } })}
                              placeholder="この巻だけのタイトル（省略可）" />
                          </div>
                        ))}
                      </div>
                    ))}
                  </div>
                )}

                {b.note && !editing && <div className="bs-note">{b.note}</div>}

                <div className="bs-acts">
                  {b.kind === "series" &&
                    eds.filter((x) => b[x.k].on).map((x) => (
                      <span key={x.k} style={{ display: "inline-flex", gap: 6 }}>
                        <button className="bs-btn ghost tiny" onClick={() => setTotal(b, x.k, b[x.k].total + 1)}>
                          {b.scope === "domestic" ? "巻数＋1" : `${x.label}＋1`}
                        </button>
                        <button className="bs-btn ghost tiny" onClick={() => setTotal(b, x.k, b[x.k].total - 1)}>−1</button>
                        <button className="bs-btn ghost tiny" onClick={() => patchEd(b, x.k, { owned: nums(b[x.k].total) })}>
                          {b.scope === "domestic" ? "全巻そろえた" : `${x.label}そろえた`}
                        </button>
                      </span>
                    ))}
                  <button className="bs-btn ghost tiny" onClick={() => setEditId(editing ? null : b.id)}>{editing ? "編集を終える" : "編集"}</button>
                  {SCOPES.filter((c) => c.id !== b.scope).map((c) => (
                    <button key={c.id} className="bs-btn ghost tiny" onClick={() => patch(b.id, { scope: c.id })}>
                      {c.label}へ移動
                    </button>
                  ))}
                  <button className="bs-btn ghost tiny" onClick={() => setAskDel(b.id)}>削除</button>
                </div>
              </div>
            );
          })
        )}

        {askDel && (() => {
          const target = books.find((b) => b.id === askDel);
          if (!target) return null;
          return (
            <div className="bs-modal" onClick={() => setAskDel(null)}>
              <div className="bs-modal-in" onClick={(e) => e.stopPropagation()}>
                <h2 className="bs-mincho" style={{ fontSize: 20, margin: "0 0 10px" }}>削除しますか？</h2>
                <p className="bs-hint" style={{ fontSize: 14, marginBottom: 4 }}>この作品を棚から削除します。元に戻せません。</p>
                <p className="bs-ct" style={{ margin: "10px 0 20px" }}>{target.title}</p>
                <div className="bs-acts">
                  <button className="bs-btn ghost" onClick={() => setAskDel(null)}>いいえ</button>
                  <button className="bs-btn" style={{ background: "var(--deep)" }} onClick={() => { persist(books.filter((x) => x.id !== askDel)); setAskDel(null); }}>はい</button>
                </div>
              </div>
            </div>
          );
        })()}

        {modal === "gaps" && (
          <div className="bs-modal" onClick={() => setModal(null)}>
            <div className="bs-modal-in" onClick={(e) => e.stopPropagation()}>
              <h2 className="bs-mincho" style={{ fontSize: 20, margin: "0 0 4px" }}>足りない巻</h2>
              <p className="bs-hint" style={{ marginBottom: 12 }}>書店ではこの画面を開いてください。原書と翻訳が並んで出ます。</p>
              {gapBooks.length === 0 ? (
                <div className="bs-empty">抜けはありません。</div>
              ) : (
                <>
                  {SCOPES.map((c) => {
                    const rows = gapBooks.filter((b) => b.scope === c.id);
                    if (!rows.length) return null;
                    return (
                      <div key={c.id} style={{ marginBottom: 14 }}>
                        <p className="bs-eyebrow">{c.label}</p>
                        {rows.map((b) => (
                          <div className="bs-gaprow" key={b.id}>
                            <div>{b.title}{b.alt ? <em>　{b.alt}</em> : null}</div>
                            <div style={{ marginTop: 3 }}>
                              {workMiss(b).map((x) => (
                                <span key={x.k} style={{ marginRight: 14 }}>
                                  <em>{b.scope === "domestic" ? "" : x.label + " "}</em>
                                  <b>{b.kind === "single" ? "未所持" : missLabel(b[x.k], x.miss)}</b>
                                </span>
                              ))}
                            </div>
                          </div>
                        ))}
                      </div>
                    );
                  })}
                  <p className="bs-eyebrow" style={{ margin: "14px 0 6px" }}>コピー用</p>
                  <textarea className="bs-ta" readOnly value={gapText} onFocus={(e) => e.target.select()} />
                </>
              )}
              <div className="bs-acts"><button className="bs-btn ghost" onClick={() => setModal(null)}>閉じる</button></div>
            </div>
          </div>
        )}

        {modal === "data" && (
          <div className="bs-modal" onClick={() => setModal(null)}>
            <div className="bs-modal-in" onClick={(e) => e.stopPropagation()}>
              <h2 className="bs-mincho" style={{ fontSize: 20, margin: "0 0 4px" }}>データ管理</h2>
              <p className="bs-hint" style={{ marginBottom: 12 }}>この文字列を控えておけば、別の端末でも同じ棚を復元できます。</p>
              <textarea className="bs-ta" readOnly value={JSON.stringify(books, null, 2)} onFocus={(e) => e.target.select()} />
              <p className="bs-eyebrow" style={{ margin: "16px 0 6px" }}>読み込み</p>
              <textarea className="bs-ta" placeholder="控えたJSONを貼り付けてください" value={importText} onChange={(e) => setImportText(e.target.value)} />
              <div className="bs-acts">
                <button className="bs-btn" onClick={() => {
                  try {
                    const data = JSON.parse(importText);
                    if (!Array.isArray(data)) throw new Error();
                    const ids = new Set(books.map((b) => b.id));
                    persist([...books, ...data.filter((d) => d && d.title && !ids.has(d.id)).map((d) => ({ ...d, id: d.id || uid() }))]);
                    setModal(null); setImportText("");
                  } catch (e) {
                    setNote("JSONを読み取れませんでした。形式を確認してください");
                    setTimeout(() => setNote(""), 2600);
                  }
                }}>追加で読み込む</button>
                <button className="bs-btn ghost" onClick={() => setModal(null)}>閉じる</button>
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Bookshelf />);
</script>
</body>
</html>
