<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>買い物リスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #e7e7e9;
    --ink: #2b2b2e;
    --sub-ink: #6d6d72;
    --card: #ffffff;
    --line: #d7d7db;

    --blue-100: #e3f5fb;
    --blue-300: #9adcef;
    --blue-500: #3fb4dd;
    --blue-700: #0e7ea3;
    --blue-900: #0a5c78;

    --yellow-100: #fff3c4;
    --yellow-300: #ffe066;
    --yellow-500: #ffce1f;
    --yellow-700: #cf9a00;

    --warn-bg: #fff3c4;
    --warn-text: #8a6a00;
    --warn-border: #ffce1f;

    --green-100: #e1f3e4;
    --green-300: #8fd6a1;
    --green-500: #3fa35c;
    --green-700: #1f7a3c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    min-height:100vh;
    padding-bottom:40px;
  }
  .wrap{max-width:480px;margin:0 auto;padding:0 16px;}

  header{
    padding:28px 16px 20px;
    text-align:center;
    position:relative;
  }
  header::after{
    content:"";
    display:block;
    width:64px;height:5px;
    background:var(--blue-500);
    margin:14px auto 0;
    border-radius:4px;
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:0.3em;
    color:var(--blue-700);
    font-weight:700;
  }
  h1{
    font-family:'Shippori Mincho', serif;
    font-size:28px;
    font-weight:700;
    margin:6px 0 4px;
    letter-spacing:0.06em;
    color:var(--ink);
  }
  .sub{
    font-size:13px;
    color:var(--sub-ink);
    line-height:1.6;
  }

  .summary{
    display:flex;
    gap:10px;
    margin:18px 0 22px;
  }
  .summary-card{
    flex:1;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 10px;
    text-align:center;
  }
  .summary-num{
    font-family:'Shippori Mincho', serif;
    font-size:26px;
    font-weight:700;
    color:var(--blue-700);
  }
  .summary-num.warn{color:var(--yellow-700);}
  .summary-label{
    font-size:11px;
    color:var(--sub-ink);
    margin-top:2px;
  }

  .add-box{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px;
    margin-bottom:24px;
  }
  .add-box h2{
    font-size:13px;
    font-weight:700;
    margin:0 0 12px;
    color:var(--blue-700);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .add-box h2::before{
    content:"";
    width:8px;height:8px;
    background:var(--yellow-500);
    border-radius:50%;
    display:inline-block;
  }
  .field-label{
    font-size:11px;
    color:var(--sub-ink);
    margin:10px 0 5px 2px;
  }
  input, select{
    font-family:inherit;
    font-size:14px;
    border:1px solid var(--line);
    background:#fbfbfc;
    border-radius:10px;
    padding:10px 12px;
    color:var(--ink);
    width:100%;
  }
  input:focus, select:focus{outline:2px solid var(--blue-500);outline-offset:1px;}
  .field-row{display:flex;gap:10px;align-items:flex-start;}
  .months-row{display:flex;gap:8px;align-items:center;}
  .months-row input{flex:1;}
  .months-unit{
    font-size:13px;
    color:var(--sub-ink);
    white-space:nowrap;
    padding:0 2px;
  }
  .cat-chips{
    display:flex;
    gap:6px;
    margin-bottom:4px;
    flex-wrap:wrap;
  }
  .chip{
    font-size:12px;
    padding:6px 12px;
    border-radius:20px;
    border:1px solid var(--line);
    background:#fbfbfc;
    cursor:pointer;
    color:var(--sub-ink);
    transition:all .15s;
  }
  .chip.active{
    background:var(--blue-500);
    border-color:var(--blue-500);
    color:#fff;
    font-weight:700;
  }
  .add-btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:var(--blue-700);
    color:#fff;
    font-weight:700;
    font-size:14px;
    font-family:inherit;
    cursor:pointer;
    letter-spacing:0.05em;
    margin-top:14px;
  }
  .add-btn:active{background:var(--blue-900);}

  .section-title{
    font-size:12px;
    font-weight:700;
    color:var(--blue-700);
    letter-spacing:0.1em;
    margin:22px 0 10px 4px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section-title::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }

  .item-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 14px;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:12px;
    position:relative;
    overflow:hidden;
  }
  .item-card.low{
    border-color:var(--warn-border);
    background:var(--warn-bg);
  }
  .item-card::before{
    content:"";
    position:absolute;
    left:0;top:0;bottom:0;
    width:5px;
    background:var(--cat-color, var(--blue-500));
  }
  .item-info{flex:1;min-width:0;}
  .item-name{
    font-size:15px;
    font-weight:700;
    margin-bottom:5px;
    word-break:break-word;
  }
  .item-meta{
    font-size:11px;
    color:var(--sub-ink);
    display:flex;
    gap:6px;
    align-items:center;
    flex-wrap:wrap;
    margin-bottom:8px;
  }
  .cat-tag{
    font-size:10px;
    padding:2px 8px;
    border-radius:10px;
    background:var(--cat-bg, var(--blue-100));
    color:var(--cat-color, var(--blue-700));
    font-weight:700;
  }
  .qty-badge{
    font-size:10px;
    padding:2px 9px;
    border-radius:10px;
    font-weight:700;
    display:inline-flex;
    align-items:center;
    gap:3px;
  }
  .legend{
    font-size:10px;
    color:var(--sub-ink);
    margin:-4px 0 14px 4px;
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .legend-steps{
    display:flex;
    gap:3px;
  }
  .legend-step{
    width:14px;height:14px;
    border-radius:4px;
  }
  .cart-reset-bar{
    display:none;
    align-items:center;
    justify-content:space-between;
    background:var(--green-100);
    border:1px solid var(--green-300);
    border-radius:12px;
    padding:10px 14px;
    margin-bottom:14px;
  }
  .cart-reset-bar.show{display:flex;}
  .cart-reset-text{
    font-size:12px;
    font-weight:700;
    color:var(--green-700);
  }
  .cart-reset-btn{
    border:none;
    background:var(--green-700);
    color:#fff;
    font-family:inherit;
    font-size:12px;
    font-weight:700;
    padding:8px 14px;
    border-radius:10px;
    cursor:pointer;
    white-space:nowrap;
  }
  .cart-reset-btn:active{background:var(--green-500);}
  .countdown{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .countdown-bar{
    flex:1;
    height:6px;
    background:var(--line);
    border-radius:4px;
    overflow:hidden;
  }
  .countdown-fill{
    height:100%;
    background:var(--blue-500);
    border-radius:4px;
    transition:width .3s;
  }
  .countdown-fill.low{background:var(--yellow-500);}
  .countdown-text{
    font-size:11px;
    font-weight:700;
    color:var(--blue-700);
    white-space:nowrap;
  }
  .countdown-text.low{color:var(--warn-text);}
  .item-actions{
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    gap:6px;
    align-items:stretch;
  }
  .refill-btn{
    border:1.5px solid var(--blue-500);
    color:var(--blue-700);
    background:transparent;
    font-family:inherit;
    font-size:12px;
    font-weight:700;
    padding:9px 14px;
    border-radius:10px;
    cursor:pointer;
    white-space:nowrap;
  }
  .refill-btn:active{
    background:var(--blue-500);
    color:#fff;
  }
  .cart-btn{
    border:1.5px solid var(--green-500);
    color:var(--green-700);
    background:transparent;
    font-family:inherit;
    font-size:12px;
    font-weight:700;
    padding:9px 14px;
    border-radius:10px;
    cursor:pointer;
    white-space:nowrap;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;
  }
  .cart-btn.checked{
    background:var(--green-500);
    color:#fff;
    border-color:var(--green-500);
  }
  .item-card.in-cart{
    opacity:0.6;
  }
  .item-card.in-cart .item-name{
    text-decoration:line-through;
    text-decoration-color:var(--green-500);
  }

  .empty{
    text-align:center;
    padding:36px 20px;
    color:var(--sub-ink);
    font-size:13px;
    background:var(--card);
    border:1px dashed var(--line);
    border-radius:14px;
    line-height:1.8;
  }

  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(30,30,32,0.45);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:200;
    padding:20px;
  }
  .modal-overlay.show{display:flex;}
  .modal-box{
    background:#fff;
    border-radius:18px;
    padding:22px 20px;
    width:100%;
    max-width:340px;
    box-shadow:0 10px 40px rgba(0,0,0,0.25);
  }
  .modal-title{
    font-family:'Shippori Mincho', serif;
    font-size:18px;
    font-weight:700;
    color:var(--blue-700);
    margin-bottom:4px;
  }
  .modal-sub{
    font-size:13px;
    color:var(--sub-ink);
    margin-bottom:14px;
  }
  .modal-box input{
    margin-bottom:16px;
  }
  .modal-actions{
    display:flex;
    gap:10px;
  }
  .modal-cancel, .modal-confirm{
    flex:1;
    padding:11px;
    border-radius:10px;
    font-family:inherit;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
  }
  .modal-cancel{
    border:1.5px solid var(--line);
    background:#fff;
    color:var(--sub-ink);
  }
  .modal-confirm{
    border:none;
    background:var(--blue-700);
    color:#fff;
  }
  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:#fafafa;
    padding:10px 18px;
    border-radius:30px;
    font-size:13px;
    opacity:0;
    transition:all .25s ease;
    pointer-events:none;
    white-space:nowrap;
    max-width:90vw;
    text-align:center;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">STOCK LIST</div>
    <h1>買い物リスト</h1>
    <div class="sub">何ヶ月分あるかを入力すると、<br>残りの月数が自動で減っていくよ。</div>
  </header>

  <div class="summary">
    <div class="summary-card">
      <div class="summary-num" id="statCount">0</div>
      <div class="summary-label">在庫アイテム数</div>
    </div>
    <div class="summary-card">
      <div class="summary-num warn" id="statLow">0</div>
      <div class="summary-label">そろそろ購入</div>
    </div>
    <div class="summary-card">
      <div class="summary-num" id="statCart" style="color:var(--green-700);">0</div>
      <div class="summary-label">カゴに入れた数</div>
    </div>
  </div>

  <div class="add-box">
    <h2>在庫を登録する</h2>

    <div class="field-label">カテゴリ</div>
    <div class="cat-chips" id="catChips">
      <div class="chip active" data-cat="食品" data-color="#cf9a00" data-bg="#fff3c4">食品</div>
      <div class="chip" data-cat="日用品" data-color="#0e7ea3" data-bg="#e3f5fb">日用品</div>
      <div class="chip" data-cat="医薬品" data-color="#0a5c78" data-bg="#cdeaf5">医薬品</div>
      <div class="chip" data-cat="その他" data-color="#8a6a00" data-bg="#ffe9a3">その他</div>
    </div>

    <div class="field-label">品名</div>
    <input id="itemName" type="text" placeholder="例：洗剤、パスタ">

    <div class="field-row" style="margin-top:10px;">
      <div style="flex:1;">
        <div class="field-label" style="margin-top:0;">在庫数</div>
        <input id="itemQty" type="text" placeholder="例：2個（0でも可）">
      </div>
      <div style="flex:1;">
        <div class="field-label" style="margin-top:0;">残り何ヶ月分？</div>
        <div class="months-row">
          <input id="itemMonths" type="number" min="0" step="0.5" placeholder="例：3（0でも可）">
          <span class="months-unit">ヶ月</span>
        </div>
      </div>
    </div>

    <button class="add-btn" onclick="addItem()">＋ 追加する</button>
  </div>

  <div class="section-title">在庫あり・購入不要</div>
  <div class="legend">
    <div class="legend-steps">
      <span class="legend-step" style="background:var(--green-100)"></span>
      <span class="legend-step" style="background:var(--green-300)"></span>
      <span class="legend-step" style="background:var(--green-500)"></span>
      <span class="legend-step" style="background:var(--green-700)"></span>
    </div>
    <span>在庫が多いほど色が濃くなるよ</span>
  </div>
  <div class="cart-reset-bar" id="cartResetBar">
    <span class="cart-reset-text" id="cartResetText">カゴに0件</span>
    <button class="cart-reset-btn" onclick="resetCart()">買い物終了・一括リセット</button>
  </div>
  <div id="itemList"></div>

</div>

<div class="modal-overlay" id="refillOverlay">
  <div class="modal-box">
    <div class="modal-title" id="refillTitle">買い足し</div>
    <div class="modal-sub">残り何ヶ月分になった？</div>
    <input id="refillInput" type="number" min="0" step="0.5" placeholder="例：3">
    <div class="modal-actions">
      <button class="modal-cancel" onclick="closeRefillModal()">キャンセル</button>
      <button class="modal-confirm" onclick="confirmRefill()">更新する</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let selectedCat = "食品";
let selectedColor = "#cf9a00";
let selectedBg = "#fff3c4";
let items = [];

document.getElementById('catChips').addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if(!chip) return;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  selectedCat = chip.dataset.cat;
  selectedColor = chip.dataset.color;
  selectedBg = chip.dataset.bg;
});

function todayISO(){
  return new Date().toISOString().slice(0,10);
}

async function loadItems(){
  try{
    const raw = localStorage.getItem('stock-items-v2');
    items = raw ? JSON.parse(raw) : [];
  }catch(e){
    items = [];
  }
  render();
}

async function saveItems(){
  try{
    localStorage.setItem('stock-items-v2', JSON.stringify(items));
  }catch(e){
    showToast('保存に失敗したよ');
  }
}

function addItem(){
  const nameInput = document.getElementById('itemName');
  const qtyInput = document.getElementById('itemQty');
  const monthsInput = document.getElementById('itemMonths');
  const name = nameInput.value.trim();
  const qty = qtyInput.value.trim() || '0個';
  const monthsRaw = monthsInput.value.trim();

  if(!name){
    nameInput.focus();
    return;
  }
  if(monthsRaw === ''){
    monthsInput.focus();
    return;
  }
  const months = parseFloat(monthsRaw);
  if(isNaN(months) || months < 0){
    monthsInput.focus();
    return;
  }

  items.unshift({
    id: Date.now().toString(),
    name,
    qty,
    cat: selectedCat,
    color: selectedColor,
    bg: selectedBg,
    totalMonths: months,
    startDate: todayISO()
  });

  nameInput.value = '';
  qtyInput.value = '';
  monthsInput.value = '';
  saveItems();
  render();
  showToast(`「${name}」を追加したよ（${qty}・${months}ヶ月分）`);
}

function remainingMonths(item){
  const start = new Date(item.startDate);
  const now = new Date();
  const elapsedDays = (now - start) / (1000 * 60 * 60 * 24);
  const elapsedMonths = elapsedDays / 30.4;
  const remaining = item.totalMonths - elapsedMonths;
  return remaining;
}

function toggleCart(id){
  const item = items.find(i => i.id === id);
  if(!item) return;
  item.inCart = !item.inCart;
  saveItems();
  render();
}

function resetCart(){
  items.forEach(i => { i.inCart = false; });
  saveItems();
  render();
  showToast('カゴをリセットしたよ');
}

let refillTargetId = null;

function refill(id){
  const item = items.find(i => i.id === id);
  if(!item) return;
  refillTargetId = id;
  document.getElementById('refillTitle').textContent = `「${item.name}」を買い足し`;
  const input = document.getElementById('refillInput');
  input.value = item.totalMonths;
  document.getElementById('refillOverlay').classList.add('show');
  setTimeout(() => input.focus(), 50);
}

function closeRefillModal(){
  document.getElementById('refillOverlay').classList.remove('show');
  refillTargetId = null;
}

function confirmRefill(){
  if(!refillTargetId) return;
  const item = items.find(i => i.id === refillTargetId);
  if(!item) return;
  const raw = document.getElementById('refillInput').value.trim();
  if(raw === ''){
    document.getElementById('refillInput').focus();
    return;
  }
  const months = parseFloat(raw);
  if(isNaN(months) || months < 0){
    document.getElementById('refillInput').focus();
    return;
  }
  item.totalMonths = months;
  item.startDate = todayISO();
  item.inCart = false;
  saveItems();
  render();
  closeRefillModal();
  showToast(`「${item.name}」を${months}ヶ月分に更新したよ`);
}

function showToast(msg){
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1800);
}

function extractQtyNumber(qtyStr){
  const match = String(qtyStr || '').match(/\d+(\.\d+)?/);
  return match ? parseFloat(match[0]) : 0;
}

// Discrete, single-hue (green) steps by count — no blended gradient.
function qtyStepColor(num){
  if(num >= 10) return { bg: '#1f7a3c', text: '#ffffff' };
  if(num >= 7)  return { bg: '#3fa35c', text: '#ffffff' };
  if(num >= 4)  return { bg: '#8fd6a1', text: '#0d4020' };
  return { bg: '#e1f3e4', text: '#1f7a3c' };
}

function formatRemaining(remaining){
  if(remaining <= 0){
    return 'そろそろ切れそう';
  }
  if(remaining < 1){
    const days = Math.round(remaining * 30.4);
    return `あと約${days}日`;
  }
  const rounded = Math.round(remaining * 10) / 10;
  return `あと約${rounded}ヶ月`;
}

function render(){
  const list = document.getElementById('itemList');
  document.getElementById('statCount').textContent = items.length;

  const lowCount = items.filter(i => remainingMonths(i) <= 1).length;
  document.getElementById('statLow').textContent = lowCount;
  const cartCount = items.filter(i => i.inCart).length;
  document.getElementById('statCart').textContent = cartCount;
  const resetBar = document.getElementById('cartResetBar');
  if(cartCount > 0){
    resetBar.classList.add('show');
    document.getElementById('cartResetText').textContent = `カゴに${cartCount}件`;
  }else{
    resetBar.classList.remove('show');
  }

  if(items.length === 0){
    list.innerHTML = `<div class="empty">まだ在庫の記録がないよ。<br>上のフォームから追加してね。</div>`;
    return;
  }

  const sorted = [...items].sort((a,b) => remainingMonths(a) - remainingMonths(b));

  list.innerHTML = sorted.map(item => {
    const remaining = remainingMonths(item);
    const isLow = remaining <= 1;
    const pct = Math.max(0, Math.min(100, (remaining / item.totalMonths) * 100));

    const step = qtyStepColor(extractQtyNumber(item.qty));
    const inCart = !!item.inCart;
    return `
    <div class="item-card ${isLow ? 'low' : ''} ${inCart ? 'in-cart' : ''}" style="--cat-color:${item.color};--cat-bg:${item.bg}">
      <div class="item-info">
        <div class="item-name">${escapeHtml(item.name)}</div>
        <div class="item-meta">
          <span class="cat-tag">${item.cat}</span>
          <span class="qty-badge" style="background:${step.bg};color:${step.text}">在庫 ${item.qty || '0個'}</span>
          <span>${item.totalMonths}ヶ月分でスタート</span>
        </div>
        <div class="countdown">
          <div class="countdown-bar"><div class="countdown-fill ${isLow ? 'low' : ''}" style="width:${pct}%"></div></div>
          <div class="countdown-text ${isLow ? 'low' : ''}">${formatRemaining(remaining)}</div>
        </div>
      </div>
      <div class="item-actions">
        <button class="cart-btn ${inCart ? 'checked' : ''}" onclick="toggleCart('${item.id}')">${inCart ? '✓ カゴに入れた' : 'カゴに入れる'}</button>
        <button class="refill-btn" onclick="refill('${item.id}')">買い足した</button>
      </div>
    </div>
  `;
  }).join('');
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

document.getElementById('itemMonths').addEventListener('keypress', (e) => {
  if(e.key === 'Enter') addItem();
});
document.getElementById('itemQty').addEventListener('keypress', (e) => {
  if(e.key === 'Enter') document.getElementById('itemMonths').focus();
});
document.getElementById('itemName').addEventListener('keypress', (e) => {
  if(e.key === 'Enter') document.getElementById('itemQty').focus();
});

document.getElementById('refillInput').addEventListener('keypress', (e) => {
  if(e.key === 'Enter') confirmRefill();
});
document.getElementById('refillOverlay').addEventListener('click', (e) => {
  if(e.target.id === 'refillOverlay') closeRefillModal();
});

loadItems();
</script>
</body>
</html>
